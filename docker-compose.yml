services:
  docs:
    build: .
    ports:
      - "4321:4321"

  dev:
    build:
      context: .
      target: deps
    command: ["./node_modules/.bin/astro", "dev", "--host", "0.0.0.0", "--port", "4321"]
    ports:
      - "4321:4321"
    volumes:
      # Mount the source for hot-reload, but keep the image's node_modules
      # (built with the correct native binaries) instead of the host's.
      - .:/app
      - /app/node_modules
    environment:
      # Bind-mounts on macOS/Windows don't forward inotify events, so tell
      # the file watcher to poll instead.
      - CHOKIDAR_USEPOLLING=true
